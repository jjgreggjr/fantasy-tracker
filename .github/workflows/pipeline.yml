name: fantasy pipeline

on:
  schedule:
    # GitHub cron is UTC and ignores DST. Mountain time is UTC-6 until Nov 1,
    # then UTC-7, so these land one hour earlier in November. Harmless.
    #
    # Minutes are deliberately off :00/:30. GitHub queues every cron in the
    # world at those marks and delays or drops the excess: the first Friday
    # run went 94 min late and the first Tuesday run never fired at all.
    # Tuesday also gets a backstop slot — the run is idempotent, so a double
    # run costs ~35s and changes nothing.
    - cron: "37 18 * * 2"   # Tue 12:37 MDT — main pull (Monday night stats are in)
    - cron: "41 19 * * 2"   # Tue 13:41 MDT — backstop in case the 18:37 slot was dropped
    - cron: "7 14 * * 3"    # Wed 08:07 MDT — snap-count backfill
    - cron: "11 22 * * 5"   # Fri 16:11 MDT — final injury designations
    # Sunday gets two pre-lock slots because one is not enough. Every scheduled run this season
    # arrived 1.4-5.75 h after its cron time (GitHub queues cron under load), so a lone 15:52 run
    # usually lands after the 17:00 UTC early-slate lock and refreshes nothing that matters. The
    # 13:52 slot is the one meant to land before the lock even when it is 3 h late; 15:52 stays as
    # its backstop and as the on-time case. Both are safe to run together: the serve re-predicts
    # only games that have not kicked off and freezes the rest, so two or three serves in a day
    # leave one row per player (tests: SundayServe), and the props archive will not re-buy a game
    # snapshotted in the last 30 h. The earlier run also matters for the props fetcher: its window
    # is 40 h, so Friday's run reaches only games kicking off before Sunday 14:11 UTC, while a
    # Sunday run puts every Sunday game and Monday night inside the window, and the 13:52 slot
    # snapshots the 1 pm slate before it kicks off even when the cron is hours late.
    - cron: "52 13 * * 0"   # Sun 07:52 MDT — pre-lock refresh, the early one (lands before 17:00 UTC even when 3 h late)
    - cron: "52 15 * * 0"   # Sun 09:52 MDT — pre-lock refresh, backstop
  workflow_dispatch:        # the "Run workflow" button — first run, and any refresh

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # Pinned, not ubuntu-latest: GitHub moves `latest` to Ubuntu 26 starting Oct 19, which swaps the
    # OS under a pipeline that runs unattended. Upgrade on purpose, with a test run on the branch.
    # Revisit once GitHub's Oct 19 migration has settled (the runner image and toolcache churn
    # also forked the ~685 MB pip caches when Python went 3.12.14 -> 3.12.15).
    runs-on: ubuntu-24.04
    timeout-minutes: 30               # was 20: the model step below has its own 10-minute cap and must never cost the commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # nflverse files are large (depth charts ~50 MB) and change slowly.
      # Restore the newest cache, save a fresh one each run.
      - uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # The `secrets` context is not available in a step-level `if:`, so the
      # "only when both are set" gate lives in the shell instead. Secrets stay
      # scoped to this one step.
      - name: ESPN cookies (only when both secrets are set)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ -n "$ESPN_S2" ] && [ -n "$ESPN_SWID" ]; then
            mkdir -p secrets
            printf '{"espn_s2": "%s", "SWID": "%s"}\n' "$ESPN_S2" "$ESPN_SWID" > secrets/espn_cookies.json
            echo "wrote secrets/espn_cookies.json"
          else
            echo "ESPN secrets not set - skipping (ESPN leagues will be skipped)"
          fi

      - name: Run pipeline
        id: pipeline
        continue-on-error: true          # always reach the commit step
        run: python -m ff.run_weekly --strict

      # ---- Phase 3: the boosted-tree model, side by side with E_pts --------------------
      # Everything between here and the commit is failure-isolated. `python -m model.serve`
      # and `python -m model.scoreboard` catch every exception themselves (a missing library,
      # a dead host, bad data), write a WARN row to logs/runs.csv and exit 0 without touching
      # an output; the continue-on-error / timeout-minutes below cover the rest (a failed
      # install, a hang). Nothing the existing pipeline wrote is ever changed by a failure,
      # and the model step never decides whether the job is green: only the pipeline step does.
      # Model dependencies and their pip cache are kept apart from the pipeline's.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install model dependencies
        continue-on-error: true
        timeout-minutes: 5
        run: pip install -r model/requirements.txt

      # model/cache holds the nflverse files and the feature-matrix cache (keyed on a hash of
      # the feature code inside serve). The files that change in season are re-downloaded every
      # run, so the Actions key only has to stop the cache growing: it is keyed on the model
      # dependencies, the feature code and the ISO week, so it is saved once per week per code
      # change (not once per run, which would churn the 10 GB quota and evict the pip caches)
      # and every other run is an exact hit. The restore-keys fall back to the newest older one.
      - name: Cache key for the model (ISO week)
        id: modelweek
        continue-on-error: true
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: model/cache
          key: model-cache-${{ hashFiles('model/requirements.txt', 'model/features.py', 'model/point_in_time.py', 'model/labels.py', 'model/build_features.py') }}-${{ steps.modelweek.outputs.week }}
          restore-keys: |
            model-cache-${{ hashFiles('model/requirements.txt', 'model/features.py', 'model/point_in_time.py', 'model/labels.py', 'model/build_features.py') }}-
            model-cache-

      - name: Model side by side with E_pts, then the live scoreboard
        id: model
        continue-on-error: true
        timeout-minutes: 10
        run: python -m model.serve && python -m model.scoreboard

      # ---- Phase 4: the player-props archive (The Odds API), archive only ---------------
      # Skips with one WARN line while the ODDS_API_KEY secret does not exist. Same isolation as the
      # model step: the module catches every exception itself (a WARN row in runs.csv, nothing
      # written, exit 0), and continue-on-error / the timeout cover the rest. It writes game by game,
      # so a cut-off run keeps what it already paid for. It needs only pandas and requests from the
      # pipeline's own install, so it does not depend on the model install. The secret reaches this
      # one step, and the module scrubs it from everything it prints or logs.
      - name: Player props archive (skips when ODDS_API_KEY is not set)
        continue-on-error: true
        timeout-minutes: 5
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m model.fetch_props

      - name: Commit results
        run: |
          git config user.name  "fantasy-bot"
          git config user.email "fantasy-bot@users.noreply.github.com"
          # runs.csv only exists once the pipeline reaches log_run(); an early
          # crash must still commit whatever did get written.
          git add data leagues reports config.json
          if [ -f logs/runs.csv ]; then git add logs/runs.csv; fi
          if [ -f model/reports/live_scoreboard.md ]; then git add model/reports/live_scoreboard.md; fi
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          WEEK=$(python -c "import pandas as pd; print(int(pd.read_csv('logs/runs.csv').week.iloc[-1]))" 2>/dev/null || echo "?")
          git commit -m "pipeline: $(date -u +%Y-%m-%d) week ${WEEK} [skip ci]"
          git push

      - name: Fail the job if integrity checks failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Pipeline reported integrity FAIL or crashed — see logs/runs.csv and the step log above"
          exit 1
