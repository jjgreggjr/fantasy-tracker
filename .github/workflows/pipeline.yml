name: fantasy pipeline

on:
  schedule:
    # GitHub cron is UTC and ignores DST. Mountain time is UTC-6 until Nov 1,
    # then UTC-7, so these land one hour earlier in November. Harmless.
    #
    # Minutes are deliberately off :00/:30. GitHub queues every cron in the
    # world at those marks and delays or drops the excess: the first Friday
    # run went 94 min late and the first Tuesday run never fired at all.
    # Tuesday also gets a backstop slot — the run is idempotent, so a double
    # run costs ~35s and changes nothing.
    - cron: "37 18 * * 2"   # Tue 12:37 MDT — main pull (Monday night stats are in)
    - cron: "41 19 * * 2"   # Tue 13:41 MDT — backstop in case the 18:37 slot was dropped
    - cron: "7 14 * * 3"    # Wed 08:07 MDT — snap-count backfill
    - cron: "11 22 * * 5"   # Fri 16:11 MDT — final injury designations
  workflow_dispatch:        # the "Run workflow" button — first run, and any refresh

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30               # was 20: the model step below has its own 10-minute cap and must never cost the commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # nflverse files are large (depth charts ~50 MB) and change slowly.
      # Restore the newest cache, save a fresh one each run.
      - uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      # The `secrets` context is not available in a step-level `if:`, so the
      # "only when both are set" gate lives in the shell instead. Secrets stay
      # scoped to this one step.
      - name: ESPN cookies (only when both secrets are set)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ -n "$ESPN_S2" ] && [ -n "$ESPN_SWID" ]; then
            mkdir -p secrets
            printf '{"espn_s2": "%s", "SWID": "%s"}\n' "$ESPN_S2" "$ESPN_SWID" > secrets/espn_cookies.json
            echo "wrote secrets/espn_cookies.json"
          else
            echo "ESPN secrets not set - skipping (ESPN leagues will be skipped)"
          fi

      - name: Run pipeline
        id: pipeline
        continue-on-error: true          # always reach the commit step
        run: python -m ff.run_weekly --strict

      # ---- Phase 3: the boosted-tree model, side by side with E_pts --------------------
      # Everything between here and the commit is failure-isolated. `python -m model.serve`
      # and `python -m model.scoreboard` catch every exception themselves (a missing library,
      # a dead host, bad data), write a WARN row to logs/runs.csv and exit 0 without touching
      # an output; the continue-on-error / timeout-minutes below cover the rest (a failed
      # install, a hang). Nothing the existing pipeline wrote is ever changed by a failure,
      # and the model step never decides whether the job is green: only the pipeline step does.
      # Model dependencies and their pip cache are kept apart from the pipeline's.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: model/requirements.txt

      - name: Install model dependencies
        continue-on-error: true
        timeout-minutes: 5
        run: pip install -r model/requirements.txt

      # model/cache holds the nflverse files and the feature-matrix cache (keyed on a hash of
      # the feature code inside serve). The files that change in season are re-downloaded every run.
      - uses: actions/cache@v4
        with:
          path: model/cache
          key: model-cache-${{ github.run_id }}
          restore-keys: model-cache-

      - name: Model side by side with E_pts, then the live scoreboard
        id: model
        continue-on-error: true
        timeout-minutes: 10
        run: python -m model.serve && python -m model.scoreboard

      - name: Commit results
        run: |
          git config user.name  "fantasy-bot"
          git config user.email "fantasy-bot@users.noreply.github.com"
          # runs.csv only exists once the pipeline reaches log_run(); an early
          # crash must still commit whatever did get written.
          git add data leagues reports config.json
          if [ -f logs/runs.csv ]; then git add logs/runs.csv; fi
          if [ -f model/reports/live_scoreboard.md ]; then git add model/reports/live_scoreboard.md; fi
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          WEEK=$(python -c "import pandas as pd; print(int(pd.read_csv('logs/runs.csv').week.iloc[-1]))" 2>/dev/null || echo "?")
          git commit -m "pipeline: $(date -u +%Y-%m-%d) week ${WEEK} [skip ci]"
          git push

      - name: Fail the job if integrity checks failed
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Pipeline reported integrity FAIL or crashed — see logs/runs.csv and the step log above"
          exit 1
